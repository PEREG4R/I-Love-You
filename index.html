<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050505;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1;
            padding: 20px;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .heart-path {
            fill: none;
            stroke: transparent;
        }
        .heart-text {
            font-size: 16px;
            font-weight: bold;
            fill: #ff2d55;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff2d55, 0 0 20px #ff2d55;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 600 600">
            <path id="heart" class="heart-path" d="M300,180 C300,180 260,100 180,100 C100,100 80,180 80,240 C80,340 180,420 300,500 C420,420 520,340 520,240 C520,180 500,100 420,100 C340,100 300,180 300,180 Z" />
            <text class="heart-text">
                <textPath href="#heart" id="text-path" startOffset="100%">
                </textPath>
            </text>
        </svg>
    </div>

    <script>
        const textPath = document.getElementById('text-path');
        const phrase = "I LOVE YOU ";
        textPath.textContent = phrase.repeat(40);

        let offset = 100;
        
        function animateHeart() {
            if (offset > 0) {
                offset -= 0.5;
                textPath.setAttribute('startOffset', offset + '%');
                requestAnimationFrame(animateHeart);
            } else {
                let floatOffset = 0;
                function floatText() {
                    floatOffset -= 0.1;
                    textPath.setAttribute('startOffset', floatOffset + '%');
                    requestAnimationFrame(floatText);
                }
                floatText();
            }
        }

        setTimeout(animateHeart, 1000);
    </script>
</body>
</html>
